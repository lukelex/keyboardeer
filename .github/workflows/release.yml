name: Linux release

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version without the v prefix"
        required: true
        default: "1.0.0-alpha.1"
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@v4
        with:
          node-version: "22.12"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install Linux build dependencies
        run: sudo apt-get update && sudo apt-get install --yes libgtk-3-dev libwebkit2gtk-4.1-dev pkg-config dpkg-dev
      - name: Install frontend dependencies
        run: npm ci
        working-directory: frontend
      - name: Verify frontend
        run: |
          npm run check
          npm run build
        working-directory: frontend
      - name: Verify Go
        run: |
          go test ./...
          go vet ./...

  package:
    needs: test
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@v4
        with:
          node-version: "22.12"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install Linux packaging dependencies
        run: sudo apt-get update && sudo apt-get install --yes libgtk-3-dev libwebkit2gtk-4.1-dev pkg-config dpkg-dev
      - name: Read release stage
        env:
          VERSION: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || inputs.version }}
        run: |
          # Versions are MAJOR.MINOR.PATCH, optionally followed by -alpha.N or
          # -rc.N. Both stages publish as GitHub pre-releases.
          version="${VERSION#v}"
          if [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+-alpha\.([0-9]+)$ ]]; then
            echo "RELEASE_TITLE=Alpha release ${BASH_REMATCH[1]}" >> "$GITHUB_ENV"
            echo "RELEASE_FLAGS=--prerelease" >> "$GITHUB_ENV"
          elif [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+-rc\.([0-9]+)$ ]]; then
            echo "RELEASE_TITLE=Release candidate ${BASH_REMATCH[1]}" >> "$GITHUB_ENV"
            echo "RELEASE_FLAGS=--prerelease" >> "$GITHUB_ENV"
          elif [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "RELEASE_TITLE=KeyboarDeer $version" >> "$GITHUB_ENV"
            echo "RELEASE_FLAGS=" >> "$GITHUB_ENV"
          else
            echo "::error::Version $VERSION must be X.Y.Z, X.Y.Z-alpha.N, or X.Y.Z-rc.N."
            exit 1
          fi
      - name: Build release artifacts
        env:
          VERSION: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || inputs.version }}
        run: scripts/package-linux-release.sh
      - name: Upload workflow artifacts
        uses: actions/upload-artifact@v4
        with:
          name: keyboardeer-linux-${{ github.ref_name || inputs.version }}
          path: dist/
      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/* \
            --title "$RELEASE_TITLE" $RELEASE_FLAGS --generate-notes
